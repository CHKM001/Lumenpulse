name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile/.ci-trigger'

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './apps/mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc -- --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage

  # Issue #1402: end-to-end smoke suite, run headlessly against the Expo web
  # build (the one Expo platform that needs no emulator/simulator in CI).
  mobile-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './apps/mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: npm run e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 7
